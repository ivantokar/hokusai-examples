# docker compose up vapor          -> http://localhost:8081
# docker compose up hummingbird    -> http://localhost:8082
# Both can run together: different published ports, the same Web UI, each served by its own integration.
services:
  vapor:
    build: { context: ., dockerfile: docker/Dockerfile, args: { PRODUCT: vapor-server } }
    ports: ["8081:8080"]
    environment: { PORT: "8080" }
  hummingbird:
    build: { context: ., dockerfile: docker/Dockerfile, args: { PRODUCT: hummingbird-server } }
    ports: ["8082:8080"]
    environment: { PORT: "8080" }
